    <path d="M128 114 L160 114 L160 144 L178 144"/>
    <path d="M128 172 L146 172 L160 186"/>
  </g>
  <g fill="#269CEF">
    <circle cx="92" cy="82" r="7"/>
    <circle cx="78" cy="144" r="7"/>
    <circle cx="96" cy="186" r="7"/>
    <circle cx="164" cy="82" r="7"/>
    <circle cx="178" cy="144" r="7"/>
    <circle cx="160" cy="186" r="7"/>
    <circle cx="128" cy="66" r="6"/>
    <circle cx="128" cy="114" r="6"/>
    <circle cx="128" cy="172" r="6"/>
  </g>
</svg>
