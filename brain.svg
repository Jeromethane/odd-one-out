    <!-- Left half of the brain -->
    <path d="M124 34 C96 16 58 28 52 58 C26 66 18 98 34 118 C22 140 32 168 54 176 C62 204 94 218 124 200"/>
    <!-- Right half of the brain (mirror) -->
    <path d="M132 34 C160 16 198 28 204 58 C230 66 238 98 222 118 C234 140 224 168 202 176 C194 204 162 218 132 200"/>
    <!-- Centre line -->
    <path d="M128 28 L128 206"/>
    <!-- Circuit traces, left side -->
    <path d="M128 66 L104 66 L92 82"/>
    <path d="M128 114 L96 114 L96 144 L78 144"/>
    <path d="M128 172 L110 172 L96 186"/>
    <!-- Circuit traces, right side -->
