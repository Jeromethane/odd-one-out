<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Odd Word Game — Test Runner</title>
  <style>
    body { font-family: "Segoe UI", Verdana, sans-serif; background: #1b1035; color: #f4f1ff; margin: 0; padding: 1.5rem; }
    h1 { font-size: 1.4rem; }
    .summary { font-size: 1.1rem; font-weight: 700; padding: 0.7rem 1rem; border-radius: 10px; display: inline-block; }
    .summary.pass { background: #14532d; color: #bbf7d0; }
    .summary.fail { background: #7f1d1d; color: #fecaca; }
    table { border-collapse: collapse; margin-top: 1rem; width: 100%; max-width: 1100px; }
    th, td { border: 1px solid #4b2a86; padding: 0.4rem 0.6rem; text-align: left; font-size: 0.9rem; vertical-align: top; }
    tr.failed td { background: rgba(229, 72, 77, 0.18); }
    tr.passed td.status { color: #7ce8a8; font-weight: 700; }
    tr.failed td.status { color: #ff9a9d; font-weight: 700; }
    pre { white-space: pre-wrap; margin: 0; font-size: 0.82rem; }
    #app { display: none; } /* the real game mount point, hidden while tests run */
  </style>
</head>
<body>
  <h1>Odd Word Game — automated test suite</h1>
  <p>This page loads the real game files and checks them. It is used during development.</p>
  <div id="summary" class="summary">Running…</div>
  <table id="results" hidden>
    <thead><tr><th>#</th><th>Status</th><th>Test</th><th>Details</th></tr></thead>
    <tbody></tbody>
  </table>

  <!-- The real game mount point (hidden). app.js will initialise into it. -->
  <div id="app"></div>

  <!-- Same script order as index.html -->
  <script src="../js/wordbank.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/statistics.js"></script>
  <script src="../js/game.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/app.js"></script>

  <script>
    "use strict";
    /* ======================================================================
       Tiny test framework
       ====================================================================== */
    var tests = [];
    function test(name, fn) { tests.push({ name: name, fn: fn }); }
    function assert(condition, message) {
      if (!condition) throw new Error(message || "Assertion failed");
    }
    function assertEqual(actual, expected, message) {
      if (actual !== expected) {
        throw new Error((message || "Values differ") + " — expected " + JSON.stringify(expected) +
          " but got " + JSON.stringify(actual));
      }
    }
    function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    function resetStorage() {
      window.localStorage.removeItem(OWG.storage.STORAGE_KEY);
    }
    function seed(attempts, completed, username) {
      window.localStorage.setItem(OWG.storage.STORAGE_KEY, JSON.stringify({
        username: username || "Tester",
        completedLevels: completed || [],
        seq: attempts.length,
        attempts: attempts
      }));
    }
    function makeAttempt(level, outcome, correct, wrong, id) {
      return {
        id: id, level: level, outcome: outcome, reason: outcome === "win" ? "target" : "time",
        correct: correct, wrong: wrong, rounds: correct + wrong, timeTaken: 30, endedAt: Date.now()
      };
    }

    /* ======================================================================
       A. WORD BANK INTEGRITY
       ====================================================================== */
    test("A1 — the word bank contains exactly 180 categories", function () {
      assert(Array.isArray(OWG.WORD_BANK), "WORD_BANK missing");
      assertEqual(OWG.WORD_BANK.length, 180, "Category count");
    });

    test("A2 — ids run 1..180 with no gaps or duplicates", function () {
      OWG.WORD_BANK.forEach(function (category, index) {
        assertEqual(category.id, index + 1, "Id at position " + index);
      });
    });

    test("A3 — groups match the supplied difficulty ranges", function () {
      OWG.WORD_BANK.forEach(function (category) {
        var expected = category.id <= 40 ? "easy" : (category.id <= 90 ? "intermediate" : "advanced");
        assertEqual(category.group, expected, "Group of category " + category.id);
      });
    });

    test("A4 — every category has a name and at least one word", function () {
      OWG.WORD_BANK.forEach(function (category) {
        assert(category.name && category.name.length > 0, "Category " + category.id + " has no name");
        assert(Array.isArray(category.words) && category.words.length > 0,
          "Category " + category.id + " (" + category.name + ") has no words");
        category.words.forEach(function (word) {
          assert(typeof word === "string" && word.trim().length > 0,
            "Category " + category.id + " contains an empty word");
        });
      });
    });

    test("A5 — no category contains duplicate words", function () {
      OWG.WORD_BANK.forEach(function (category) {
        var seen = Object.create(null); // avoid Object.prototype keys like "constructor"
        category.words.forEach(function (word) {
          var key = word.toLowerCase();
          assert(!seen[key], "Duplicate word '" + word + "' in category " + category.id);
          seen[key] = true;
        });
      });
    });

    test("A6 — total word count is the full supplied bank (not a sample)", function () {
      var total = OWG.WORD_BANK.reduce(function (sum, c) { return sum + c.words.length; }, 0);
      assert(total > 1500, "Only " + total + " words in the bank");
    });

    test("A7 — spot checks: short categories kept, special characters preserved", function () {
      var byId = {};
      OWG.WORD_BANK.forEach(function (c) { byId[c.id] = c; });
      assertEqual(byId[40].words.length, 7, "Category 40 (Days of the Week)");
      assertEqual(byId[44].words.length, 5, "Category 44 (Oceans) must be kept despite being small");
      assertEqual(byId[50].words.length, 5, "Category 50 (Dwarf Planets) must be kept despite being small");
      assertEqual(byId[99].words.length, 7, "Category 99 (Logic Gates) must be kept despite being small");
      assert(byId[42].words.indexOf("Brasília") !== -1, "Brasília must be preserved");
      assert(byId[92].words.indexOf("Newton's First Law") !== -1, "Newton's First Law must be preserved");
      assert(byId[69].words.indexOf(".py") !== -1, ".py must be preserved");
      assert(byId[130].words.indexOf("A* Search") !== -1, "A* Search must be preserved");
      assert(byId[120].words.indexOf("RuBisCO") !== -1, "RuBisCO must be preserved");
      assert(byId[180].words.indexOf("Mersenne Prime") !== -1, "Category 180 must be complete");
    });

    /* ======================================================================
       B. LEVEL CONFIGURATION
       ====================================================================== */
    test("B1 — level rules exactly match the specification", function () {
      var L = OWG.game.LEVELS;
      assertEqual(L[1].wordsPerRound, 5, "Level 1 words per round");
      assertEqual(L[1].seconds, 180, "Level 1 time");
      assertEqual(L[1].required, 13, "Level 1 required correct");
      assertEqual(L[1].group, "easy", "Level 1 category group");
      assertEqual(L[2].wordsPerRound, 7, "Level 2 words per round");
      assertEqual(L[2].seconds, 120, "Level 2 time");
      assertEqual(L[2].required, 9, "Level 2 required correct");
      assertEqual(L[2].group, "intermediate", "Level 2 category group");
      assertEqual(L[3].wordsPerRound, 9, "Level 3 words per round");
      assertEqual(L[3].seconds, 60, "Level 3 time");
      assertEqual(L[3].required, 5, "Level 3 required correct");
      assertEqual(L[3].group, "advanced", "Level 3 category group");
      assertEqual(L[1].maxWrong, 2, "Level 1 allowed wrong answers");
      assertEqual(L[2].maxWrong, 2, "Level 2 allowed wrong answers");
      assertEqual(L[3].maxWrong, 2, "Level 3 allowed wrong answers");
    });

    /* ======================================================================
       C. ROUND GENERATION
       ====================================================================== */
    function categoryById(id) {
      for (var i = 0; i < OWG.WORD_BANK.length; i++) {
        if (OWG.WORD_BANK[i].id === id) return OWG.WORD_BANK[i];
      }
      return null;
    }
    function norm(text) { return String(text).toLowerCase().trim(); }

    function checkRoundShape(round, level) {
      var config = OWG.game.LEVELS[level];
      assertEqual(round.words.length, config.wordsPerRound, "Round word count for level " + level);

      // No duplicates inside a round.
      var seen = Object.create(null);
      round.words.forEach(function (word) {
        assert(!seen[norm(word)], "Duplicate word in round: " + word);
        seen[norm(word)] = true;
      });

      var mainWords = categoryById(round.mainCategory.id).words.map(norm);
      var oddWords = categoryById(round.oddCategory.id).words.map(norm);
      assert(round.mainCategory.id !== round.oddCategory.id, "Main and odd category must differ");

      // Exactly one word comes from the odd category; the rest from the main one.
      var fromOdd = round.words.filter(function (word) { return oddWords.indexOf(norm(word)) !== -1; });
      var fromMain = round.words.filter(function (word) { return mainWords.indexOf(norm(word)) !== -1; });
      assertEqual(fromOdd.length, 1, "Exactly one odd-category word");
      assertEqual(fromMain.length, config.mainCount, "Main-category word count");

      // The tracked odd word really is the odd one and is in no other group.
      var oddWord = round.words[round.oddIndex];
      assertEqual(norm(oddWord), norm(fromOdd[0]), "oddIndex points at the odd word");
      assert(mainWords.indexOf(norm(oddWord)) === -1, "Odd word must not belong to the main category");

      // Both categories come from the level's difficulty group and the main
      // category is large enough.
      assertEqual(round.mainCategory.group, config.group, "Main category group");
      assertEqual(round.oddCategory.group, config.group, "Odd category group");
      assert(categoryById(round.mainCategory.id).words.length >= config.mainCount,
        "Main category too small for level " + level);

      // The hand-checked exclusion list must be respected.
      var key = Math.min(round.mainCategory.id, round.oddCategory.id) + "-" +
                Math.max(round.mainCategory.id, round.oddCategory.id);
      assert(!OWG.game.EXCLUDED_PAIRS[key], "Excluded pair used: " + key);
    }

    [1, 2, 3].forEach(function (level) {
      test("C" + level + "1 — 400 generated rounds are all valid for Level " + level, function () {
        var positions = {};
        var lastMain = null;
        for (var i = 0; i < 400; i++) {
          var round = OWG.game.generateRound(level, lastMain);
          checkRoundShape(round, level);
          positions[round.oddIndex] = true;
          // A round must not repeat the previous round's main category.
          assert(round.mainCategory.id !== lastMain, "Main category repeated in consecutive rounds");
          lastMain = round.mainCategory.id;
        }
        // The odd word must be able to appear in ANY position.
        var seenCount = Object.keys(positions).length;
        assertEqual(seenCount, OWG.game.LEVELS[level].wordsPerRound,
          "Odd word must appear in every possible position across 400 rounds");
      });
    });

    test("C4 — categories that are too small are never chosen as the main category", function () {
      var small = OWG.WORD_BANK.filter(function (c) {
        return c.group === "advanced" && c.words.length < 8;
      }).map(function (c) { return c.id; });
      assert(small.length > 0, "Expected at least one small advanced category (e.g. 99 Logic Gates)");
      for (var i = 0; i < 300; i++) {
        var round = OWG.game.generateRound(3, null);
        assert(small.indexOf(round.mainCategory.id) === -1,
          "Small category " + round.mainCategory.id + " was used as a main category");
      }
    });

    test("C5 — generation is fast and never loops forever (1000 rounds)", function () {
      var started = Date.now();
      for (var i = 0; i < 1000; i++) OWG.game.generateRound(1, null);
      var elapsed = Date.now() - started;
      assert(elapsed < 8000, "1000 rounds took " + elapsed + " ms");
    });

    test("C6 — the generator still works when Math.random is degenerate", function () {
      var originalRandom = Math.random;
      Math.random = function () { return 0; };
      try {
        [1, 2, 3].forEach(function (level) {
          var round = OWG.game.generateRound(level, null);
          checkRoundShape(round, level);
        });
      } finally {
        Math.random = originalRandom;
      }
    });

    /* ======================================================================
       D. STORAGE
       ====================================================================== */
    test("D1 — first visit has no saved data", function () {
      resetStorage();
      assertEqual(OWG.storage.hasUsername(), false, "hasUsername on first visit");
      assertEqual(OWG.storage.getUsername(), "", "username on first visit");
      assertEqual(OWG.storage.getAttempts().length, 0, "attempts on first visit");
      assertEqual(OWG.storage.getCompletedLevels().length, 0, "completed levels on first visit");
    });

    test("D2 — empty and whitespace usernames are rejected", function () {
      resetStorage();
      assertEqual(OWG.storage.setUsername("").ok, false, "empty username");
      assertEqual(OWG.storage.setUsername("   ").ok, false, "whitespace username");
      assertEqual(OWG.storage.getUsername(), "", "nothing must be saved for invalid input");
    });

    test("D3 — a valid username is trimmed and saved", function () {
      resetStorage();
      var result = OWG.storage.setUsername("  Alice  ");
      assertEqual(result.ok, true, "valid username accepted");
      assertEqual(OWG.storage.getUsername(), "Alice", "username trimmed");
    });

    test("D4 — wins and losses are both recorded, latest per level is correct", function () {
      resetStorage();
      OWG.storage.recordAttempt(makeAttempt(1, "win", 13, 1, 0));
      OWG.storage.recordAttempt(makeAttempt(1, "loss", 4, 3, 0));
      OWG.storage.recordAttempt(makeAttempt(2, "win", 9, 2, 0));

      assertEqual(OWG.storage.getAttempts().length, 3, "attempt count");
      assertEqual(OWG.storage.getLatestAttempt(1).outcome, "loss", "latest Level 1 attempt is the loss");
      assertEqual(OWG.storage.getLatestAttempt(1).correct, 4, "latest Level 1 correct count");
      assertEqual(OWG.storage.getLatestAttempt(2).outcome, "win", "latest Level 2 attempt");
      assertEqual(OWG.storage.getLatestAttempt(3), null, "Level 3 has no attempts yet");

      var totals = OWG.storage.getLifetimeTotals();
      assertEqual(totals.correct, 26, "lifetime correct = 13 + 4 + 9");
      assertEqual(totals.wrong, 6, "lifetime wrong = 1 + 3 + 2");

      var completed = OWG.storage.getCompletedLevels();
      assert(completed.indexOf(1) !== -1 && completed.indexOf(2) !== -1,
        "wins must mark their levels completed");
      assertEqual(completed.length, 2, "a loss must not complete a level");
    });

    test("D5 — changing the username never erases progress or statistics", function () {
      resetStorage();
      OWG.storage.setUsername("Alice");
      OWG.storage.recordAttempt(makeAttempt(1, "win", 13, 1, 0));
      OWG.storage.setUsername("Bob");
      assertEqual(OWG.storage.getUsername(), "Bob", "new username saved");
      assertEqual(OWG.storage.getAttempts().length, 1, "attempts survive a username change");
      assertEqual(OWG.storage.getCompletedLevels().join(","), "1", "completed levels survive");
      assertEqual(OWG.storage.getLifetimeTotals().correct, 13, "totals survive");
    });

    test("D6 — malformed saved JSON falls back to safe defaults", function () {
      resetStorage();
      window.localStorage.setItem(OWG.storage.STORAGE_KEY, "{not valid json");
      assertEqual(OWG.storage.getUsername(), "", "username fallback");
      assertEqual(OWG.storage.getAttempts().length, 0, "attempts fallback");
      assertEqual(OWG.storage.getCompletedLevels().length, 0, "levels fallback");
    });

    test("D7 — wrong-shaped saved data is cleaned, valid attempts are kept", function () {
      resetStorage();
      window.localStorage.setItem(OWG.storage.STORAGE_KEY, JSON.stringify({
        username: 42,
        completedLevels: "nope",
        attempts: [
          { level: 9, outcome: "win", correct: "x", wrong: 0, rounds: 0, timeTaken: 0 },
          makeAttempt(1, "win", 13, 0, 1),
          null
        ]
      }));
      assertEqual(OWG.storage.getUsername(), "", "non-string username ignored");
      var attempts = OWG.storage.getAttempts();
      assertEqual(attempts.length, 1, "invalid attempts dropped, valid kept");
      assertEqual(OWG.storage.getCompletedLevels().join(","), "1", "completed level recovered from the win");
    });

    /* ======================================================================
       E. STATISTICS & PROGRESSION
       ====================================================================== */
    test("E1 — fresh player: next level is 1, only Level 1 unlocked", function () {
      resetStorage();
      assertEqual(OWG.statistics.nextLevel(), 1, "next level");
      assertEqual(OWG.statistics.unlockedLevels().join(","), "1", "unlocked levels");
      assertEqual(OWG.statistics.levelStatus(1), "unlocked", "level 1 status");
      assertEqual(OWG.statistics.levelStatus(2), "locked", "level 2 status");
      assertEqual(OWG.statistics.levelStatus(3), "locked", "level 3 status");
    });

    test("E2 — progression unlocks levels only through wins", function () {
      resetStorage();
      OWG.storage.recordAttempt(makeAttempt(1, "loss", 3, 3, 0));
      assertEqual(OWG.statistics.nextLevel(), 1, "a loss must not advance the next level");
      assertEqual(OWG.statistics.levelStatus(2), "locked", "Level 2 still locked after a loss");

      OWG.storage.recordAttempt(makeAttempt(1, "win", 13, 0, 0));
      assertEqual(OWG.statistics.nextLevel(), 2, "next level after winning Level 1");
      assertEqual(OWG.statistics.levelStatus(2), "unlocked", "Level 2 unlocked");
      assertEqual(OWG.statistics.levelStatus(1), "completed", "Level 1 completed");

      OWG.storage.recordAttempt(makeAttempt(2, "win", 9, 1, 0));
      assertEqual(OWG.statistics.nextLevel(), 3, "next level after winning Level 2");
      assertEqual(OWG.statistics.unlockedLevels().join(","), "1,2,3", "all unlocked");

      OWG.storage.recordAttempt(makeAttempt(3, "win", 5, 0, 0));
      assertEqual(OWG.statistics.nextLevel(), null, "no next level when everything is done");
      assertEqual(OWG.statistics.levelsCompleted(), 3, "three levels completed");
      assertEqual(OWG.statistics.homeProgress().nextLevelText, "All levels completed!", "home text");
    });

    test("E3 — replaying a completed level and losing keeps the unlock", function () {
      resetStorage();
      OWG.storage.recordAttempt(makeAttempt(1, "win", 13, 0, 0));
      OWG.storage.recordAttempt(makeAttempt(1, "loss", 5, 3, 0));
      assert(OWG.storage.getCompletedLevels().indexOf(1) !== -1, "Level 1 must still be completed");
      assert(OWG.statistics.unlockedLevels().indexOf(2) !== -1, "Level 2 must still be unlocked");
      assertEqual(OWG.statistics.latestAttempt(1).outcome, "loss", "latest attempt is the replay loss");
    });

    test("E4 — clock formatting helpers", function () {
      assertEqual(OWG.statistics.formatClock(180), "03:00", "180s");
      assertEqual(OWG.statistics.formatClock(120), "02:00", "120s");
      assertEqual(OWG.statistics.formatClock(60), "01:00", "60s");
      assertEqual(OWG.statistics.formatClock(65), "01:05", "65s");
      assertEqual(OWG.statistics.formatClock(0), "00:00", "0s");
      assertEqual(OWG.statistics.formatDuration(96), "1 min 36 s", "96s");
    });

    /* ======================================================================
       F. GAME FLOW (fake clock, shortened feedback delays)
       ====================================================================== */
    var realNow = Date.now;
    var realFeedback, realEndFlash, realTick;

    function shortenTiming() {
      realFeedback = OWG.game.TIMING.FEEDBACK_MS;
      realEndFlash = OWG.game.TIMING.END_FLASH_MS;
      realTick = OWG.game.TIMING.TICK_MS;
      OWG.game.TIMING.FEEDBACK_MS = 0;
      OWG.game.TIMING.END_FLASH_MS = 0;
      OWG.game.TIMING.TICK_MS = 100000; // no background ticking during tests
    }
    function restoreTiming() {
      OWG.game.TIMING.FEEDBACK_MS = realFeedback;
      OWG.game.TIMING.END_FLASH_MS = realEndFlash;
      OWG.game.TIMING.TICK_MS = realTick;
      OWG.game.setNow(function () { return realNow(); });
    }

    function startObserved(level) {
      var seen = { ticks: [], rounds: 0, ends: [] };
      OWG.game.start(level, {
        onStart: function () {},
        onTick: function (s) { seen.ticks.push(s); },
        onRound: function () { seen.rounds++; },
        onAnswer: function () {},
        onEnd: function (result) {
          seen.ends.push(result);
          // Mirror exactly what app.js does when a level ends.
          OWG.storage.recordAttempt({
            level: result.level,
            outcome: result.outcome,
            reason: result.reason,
            correct: result.correct,
            wrong: result.wrong,
            rounds: result.rounds,
            timeTaken: result.timeTaken,
            endedAt: Date.now()
          });
        }
      });
      return seen;
    }

    function correctIndex() { return OWG.game.snapshot().oddIndex; }
    function wrongIndex() {
      var snap = OWG.game.snapshot();
      for (var i = 0; i < snap.words.length; i++) {
        if (i !== snap.oddIndex) return i;
      }
      return -1;
    }

    test("F1 — starting a level sets up the exact configured rules", function () {
      resetStorage();
      shortenTiming();
      try {
        var seen = startObserved(3);
        var snap = OWG.game.snapshot();
        assertEqual(snap.level, 3, "level");
        assertEqual(snap.words.length, 9, "nine words on screen for Level 3");
        assertEqual(snap.remaining, 60, "Level 3 starts at 60 seconds");
        assertEqual(seen.ends.length, 0, "no level should have ended yet");
        OWG.game.stop();
      } finally { restoreTiming(); }
    });

    test("F2 — reaching the target wins immediately and records once", async function () {
      resetStorage();
      shortenTiming();
      try {
        var seen = startObserved(3); // needs 5 correct
        for (var i = 0; i < 5; i++) {
          var result = OWG.game.submitAnswer(correctIndex());
          assert(result && result.isCorrect, "answer " + (i + 1) + " should be correct");
          await sleep(10); // let the (0 ms) round transition fire
        }
        await sleep(20);
        assertEqual(seen.ends.length, 1, "onEnd must fire exactly once");
        assertEqual(seen.ends[0].outcome, "win", "outcome");
        assertEqual(seen.ends[0].reason, "target", "reason");
        assertEqual(seen.ends[0].correct, 5, "correct answers");
        assertEqual(seen.ends[0].rounds, 5, "rounds played");

        var attempts = OWG.storage.getAttempts();
        assertEqual(attempts.length, 1, "exactly one attempt recorded");
        assertEqual(attempts[0].outcome, "win", "recorded outcome");
        assert(OWG.storage.getCompletedLevels().indexOf(3) !== -1, "Level 3 marked completed");

        // The level is over: no more answers are accepted and no second record.
        assertEqual(OWG.game.submitAnswer(correctIndex()), null, "answers after the end are ignored");
        assertEqual(seen.ends.length, 1, "still only one end event");
      } finally { restoreTiming(); }
    });

    test("F3 — the third wrong answer loses immediately", async function () {
      resetStorage();
      shortenTiming();
      try {
        var seen = startObserved(1);
        var r1 = OWG.game.submitAnswer(wrongIndex());
        assert(r1 && !r1.isCorrect && !r1.terminal, "first wrong answer must not end the level");
        await sleep(10);
        var r2 = OWG.game.submitAnswer(wrongIndex());
        assert(r2 && !r2.terminal, "second wrong answer must not end the level");
        await sleep(10);
        var r3 = OWG.game.submitAnswer(wrongIndex());
        assert(r3 && r3.terminal && r3.outcome === "loss" && r3.reason === "wrong3",
          "third wrong answer must end the level as a loss");
        await sleep(20);
        assertEqual(seen.ends.length, 1, "one end event");
        assertEqual(seen.ends[0].wrong, 3, "three wrong answers");
        var attempts = OWG.storage.getAttempts();
        assertEqual(attempts.length, 1, "one recorded attempt");
        assertEqual(OWG.storage.getCompletedLevels().length, 0, "a loss completes nothing");
      } finally { restoreTiming(); }
    });

    test("F4 — a second tap during the feedback flash is ignored", function () {
      resetStorage();
      shortenTiming();
      try {
        startObserved(1);
        var first = OWG.game.submitAnswer(correctIndex());
        assert(first !== null, "first tap accepted");
        var second = OWG.game.submitAnswer(correctIndex());
        assertEqual(second, null, "second tap during feedback must be rejected");
        var snap = OWG.game.snapshot();
        assertEqual(snap.correct, 1, "only one correct answer counted");
        assertEqual(snap.rounds, 1, "only one round counted");
        OWG.game.stop();
      } finally { restoreTiming(); }
    });

    test("F5 — the timer keeps running during feedback", async function () {
      resetStorage();
      shortenTiming();
      try {
        OWG.game.TIMING.FEEDBACK_MS = 60; // real feedback window for this test
        var fakeNow = realNow();
        OWG.game.setNow(function () { return fakeNow; });
        var seen = startObserved(2); // 120 seconds
        OWG.game.submitAnswer(correctIndex()); // enter feedback
        fakeNow += 5000; // five seconds pass while the flash is shown
        OWG.game.checkTimer();
        var remaining = OWG.game.snapshot().remaining;
        assert(remaining <= 115 && remaining >= 114, "about 115 seconds should remain, got " + remaining);
        await sleep(90); // feedback finishes, next round starts
        assertEqual(OWG.game.snapshot().phase, "answering", "next round is running");
        assertEqual(seen.rounds, 1, "one new round after the flash");
        OWG.game.stop();
      } finally { restoreTiming(); }
    });

    test("F6 — running out of time is a loss with the full time recorded", function () {
      resetStorage();
      shortenTiming();
      try {
        var fakeNow = realNow();
        OWG.game.setNow(function () { return fakeNow; });
        var seen = startObserved(1);
        fakeNow += 181000; // 181 seconds pass
        OWG.game.checkTimer();
        assertEqual(seen.ends.length, 1, "time over ends the level once");
        assertEqual(seen.ends[0].outcome, "loss", "outcome");
        assertEqual(seen.ends[0].reason, "time", "reason");
        assertEqual(seen.ends[0].timeTaken, 180, "time taken equals the level length");
        var attempts = OWG.storage.getAttempts();
        assertEqual(attempts.length, 1, "the loss is recorded once");
        assertEqual(OWG.storage.getCompletedLevels().length, 0, "no level unlocked");
        assertEqual(OWG.game.submitAnswer(correctIndex()), null, "no answers after time over");
      } finally { restoreTiming(); }
    });

    test("F7 — an interrupted attempt (stop/refresh) is not recorded", function () {
      resetStorage();
      shortenTiming();
      try {
        startObserved(1);
        OWG.game.submitAnswer(correctIndex());
        OWG.game.stop(); // same effect as refreshing the page mid-game
        assertEqual(OWG.storage.getAttempts().length, 0, "no attempt recorded on interruption");
        assertEqual(OWG.game.snapshot(), null, "game state cleared");
      } finally { restoreTiming(); }
    });

    test("F8 — retry starts the same level again from the beginning", function () {
      resetStorage();
      shortenTiming();
      try {
        var seen = startObserved(3);
        OWG.game.submitAnswer(wrongIndex());
        OWG.game.submitAnswer(wrongIndex());
        OWG.game.submitAnswer(wrongIndex());
        void seen;
        // Retry (what the Retry button does).
        var again = startObserved(3);
        var snap = OWG.game.snapshot();
        assertEqual(snap.correct, 0, "counters reset");
        assertEqual(snap.wrong, 0, "counters reset");
        assertEqual(snap.remaining, 60, "full time again");
        assertEqual(snap.words.length, 9, "nine words again");
        assertEqual(again.ends.length, 0, "fresh attempt is running");
        OWG.game.stop();
      } finally { restoreTiming(); }
    });

    /* ======================================================================
       Runner — waits until the page (and the game's own DOMContentLoaded
       start-up) has finished, so the tests control the app from a calm state.
       ====================================================================== */
    (async function run() {
      if (document.readyState === "loading") {
        await new Promise(function (resolve) {
          document.addEventListener("DOMContentLoaded", resolve);
        });
      }

      var passed = 0;
      var failures = [];
      var table = document.getElementById("results");
      var body = table.querySelector("tbody");
      table.hidden = false;

      for (var i = 0; i < tests.length; i++) {
        var entry = tests[i];
        var row = document.createElement("tr");
        var details = "";
        var ok = false;
        try {
          await entry.fn();
          ok = true;
          passed++;
        } catch (error) {
          details = error.stack || error.message;
          failures.push(entry.name + ": " + error.message);
          row.className = "failed";
        }
        row.innerHTML =
          "<td>" + (i + 1) + "</td>" +
          '<td class="status">' + (ok ? "PASS" : "FAIL") + "</td>" +
          "<td>" + entry.name.replace(/</g, "&lt;") + "</td>" +
          "<td><pre>" + details.replace(/</g, "&lt;") + "</pre></td>";
        body.appendChild(row);
      }

      // Leave the page in a clean state.
      OWG.game.stop();
      resetStorage();

      var summary = document.getElementById("summary");
      summary.textContent = passed + " of " + tests.length + " tests passed" +
        (failures.length ? " — " + failures.length + " FAILED" : "");
      summary.className = "summary " + (failures.length ? "fail" : "pass");
      document.title = "TESTS " + (failures.length ? "FAILED" : "PASSED") +
        " (" + passed + "/" + tests.length + ")";

      window.__TEST_RESULTS__ = {
        total: tests.length,
        passed: passed,
        failed: failures.length,
        failures: failures
      };
    })();
  </script>
